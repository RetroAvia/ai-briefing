<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0b1e"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5.76" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="144" height="144" rx="32" ry="32" fill="url(#bg)"/>
  <circle cx="72" cy="72" r="40" fill="url(#circle)" filter="url(#glow)"/>
  <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" font-size="40" 
        fill="white" text-anchor="middle" dominant-baseline="central">AI</text>
</svg>