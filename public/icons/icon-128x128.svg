<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0b1e"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5.12" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="35" fill="url(#circle)" filter="url(#glow)"/>
  <text x="64" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" font-size="36" 
        fill="white" text-anchor="middle" dominant-baseline="central">AI</text>
</svg>